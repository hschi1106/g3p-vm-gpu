[build-system]
requires = ["setuptools>=59"]
build-backend = "setuptools.build_meta"

[project]
name = "g3pvm-tools"
version = "0.1.0"
description = "Standard-library operational tools for g3p-vm-gpu"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
g3pvm-tools = "g3pvm_tools.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["g3pvm_tools*"]
