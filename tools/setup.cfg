[metadata]
name = gagp-tools
version = 0.1.0
description = Operational tools for GAGP program synthesis workflows

[options]
packages = find:
python_requires = >=3.10
install_requires =

[options.packages.find]
where = .
include = gagp_tools*

[options.entry_points]
console_scripts =
    gagp-tools = gagp_tools.cli:main
